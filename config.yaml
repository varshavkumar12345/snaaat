# =============================================================================
# GitHub Developer Collaboration Network & Link Prediction
# Configuration File
# =============================================================================

# --------------------------------------------------------------------------
# GitHub identity
# --------------------------------------------------------------------------
github:
  # Starting username for the ego-network expansion
  username: "varshavkumar12345"

  # Optional: GitHub Personal Access Token (PAT) for higher API rate limits.
  # Leave empty ("") to use unauthenticated access (60 req/hr limit).
  # Recommended: create a fine-grained token with public repo read access.
  token: ""

# --------------------------------------------------------------------------
# GitHub Archive collection parameters
# --------------------------------------------------------------------------
collection:
  # Date range for archive downloads (YYYY-MM-DD).
  # Narrower windows are faster; widen to get more events.
  start_date: "2024-10-01"
  end_date:   "2024-10-07"

  # Maximum number of hourly archive files to download.
  # Each file is ~20-200 MB compressed. Set low (e.g. 24) on a laptop.
  max_archive_files: 24

  # Cache downloaded .json.gz files to avoid re-downloading.
  cache_dir: "data/raw"

# --------------------------------------------------------------------------
# Graph construction parameters
# --------------------------------------------------------------------------
graph:
  # Maximum number of nodes (developers) in the collaboration graph.
  # Larger values need more memory and time.
  max_nodes: 500

  # Ego-network expansion depth (hops from the seed user).
  # depth=1 → direct collaborators; depth=2 → their collaborators, etc.
  max_depth: 2

  # Minimum edge weight (number of shared interactions) to include an edge.
  min_edge_weight: 1

# --------------------------------------------------------------------------
# Bot & noise filtering
# --------------------------------------------------------------------------
filtering:
  # Exclude known bot accounts from the graph.
  exclude_bots: true

  # Additional usernames to exclude (beyond automatic detection).
  extra_exclusions:
    - "dependabot[bot]"
    - "renovate[bot]"
    - "github-actions[bot]"
    - "snyk-bot"
    - "imgbot[bot]"
    - "allcontributors[bot]"

  # Automatically flag accounts whose login ends with [bot] or -bot.
  auto_detect_bots: true

# --------------------------------------------------------------------------
# Link Prediction & Evaluation
# --------------------------------------------------------------------------
prediction:
  # Fraction of edges held out for testing.
  test_split_ratio: 0.20

  # Random seed for reproducibility.
  random_seed: 42

  # Ratio of negative (non-existing) edges to positive (existing) edges
  # in the evaluation set.  1.0 = balanced; 2.0 = twice as many negatives.
  negative_sampling_ratio: 1.0

  # Algorithms to run (all four are required for the project).
  algorithms:
    - "common_neighbors"
    - "jaccard_coefficient"
    - "adamic_adar"
    - "preferential_attachment"

# --------------------------------------------------------------------------
# Recommendation output
# --------------------------------------------------------------------------
recommendations:
  # Top-K values for "who to follow / collaborate with" recommendations.
  top_k_values:
    - 10
    - 20

  # Output file paths (relative to project root).
  output_dir: "outputs/recommendations"

# --------------------------------------------------------------------------
# Visualization
# --------------------------------------------------------------------------
visualization:
  output_dir: "outputs/visualizations"

  # Static plots (Matplotlib)
  static:
    dpi: 150
    format: "png"      # png | pdf | svg

  # Interactive HTML (PyVis)
  interactive:
    height: "750px"
    width: "100%"
    bgcolor: "#ffffff"
    font_color: "#000000"

  # Cytoscape-compatible GraphML export
  graphml:
    enabled: true

# --------------------------------------------------------------------------
# Report & Presentation generation
# --------------------------------------------------------------------------
reports:
  output_dir: "outputs/reports"
  presentation_dir: "outputs/presentation"
  author: "Student"
  institution: "University"

# --------------------------------------------------------------------------
# Logging
# --------------------------------------------------------------------------
logging:
  level: "INFO"    # DEBUG | INFO | WARNING | ERROR
  log_file: "outputs/pipeline.log"

